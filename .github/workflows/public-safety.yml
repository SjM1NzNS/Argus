name: public-safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Public release gate
        run: python3 scripts/verify_public_release.py .
      - name: Test checksum behavior
        run: python3 -B scripts/test_update_checksums.py -v
      - name: Check checksums
        run: python3 scripts/update_checksums.py --check
      - name: Compile Python
        run: python3 -m compileall -q scripts vault/11\ -\ Scripts skills
