appsec_fyi_discovery_rule:
  root_url: https://appsec.fyi
  include_internal_links_matching:
  - https://appsec.fyi/*.html
  exclude:
  - https://appsec.fyi/index.html
  - https://appsec.fyi/glossary*
  - https://appsec.fyi/timeline*
  - https://appsec.fyi/sources*
  - https://appsec.fyi/tools*
  - https://appsec.fyi/submit*
  max_topic_pages_per_run: 10
  max_linked_resources_per_topic_per_run: 25
  notes: Process topic pages gradually to avoid creating a noisy note dump.
