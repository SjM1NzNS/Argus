# Argus canonical learning-source registry.
# Registry schema v2 makes cadence, acquisition, trust, and promotion semantics configuration-driven.
# Categorical trust never bypasses review; ingestion always produces proposal-only material.

registry:
  schema_version: 2
  description: Categorical source policy for staged Argus security learning; ingestion never implies trust.
  promotion_status_default: proposal_only
  cadence_semantics:
    daily: bounded incremental monitoring
    weekly: complete reconciliation of daily and weekly roots through static and browser lanes
    periodic: maintenance-triggered refresh only
    on_demand: explicit targeted backfill only
  knowledge_types:
  - vulnerability_pattern
  - validation_technique
  - architecture_trust_boundary
  - false_positive_condition
  - evidence_requirement
  - reportability_criterion
  - hunting_methodology
  - tooling_procedure
source_group_policies:
  web2_core_theory:
    role: foundational_reference
    domain: web2
    acquisition: deep_link_discovery
    cadence: on_demand
    trust: authority
    promotion_policy: review_required
    original_source_required: false
    independent_corroboration: conditional
    refetch_interval_days: 180
    expected_content_type: documentation
    deep_link_limit: 75
  web2_topic_indexes:
    role: discovery_index
    domain: web2
    acquisition: deep_link_discovery
    cadence: weekly
    trust: discovery_only
    promotion_policy: original_source_required
    original_source_required: true
    independent_corroboration: required
    refetch_interval_days: 7
    expected_content_type: index
    deep_link_limit: 10
  web2_continuous_monitoring:
    role: practitioner_commentary
    domain: web2
    acquisition: deep_link_discovery
    cadence: weekly
    trust: curated_secondary
    promotion_policy: corroboration_required
    original_source_required: false
    independent_corroboration: required
    refetch_interval_days: 7
    expected_content_type: article
    deep_link_limit: 5
  web3_core_theory:
    role: foundational_reference
    domain: web3
    acquisition: deep_link_discovery
    cadence: on_demand
    trust: authority
    promotion_policy: review_required
    original_source_required: false
    independent_corroboration: conditional
    refetch_interval_days: 180
    expected_content_type: documentation
    deep_link_limit: 75
  web3_continuous_monitoring:
    role: report_repository
    domain: web3
    acquisition: deep_link_discovery
    cadence: weekly
    trust: curated_secondary
    promotion_policy: corroboration_required
    original_source_required: false
    independent_corroboration: conditional
    refetch_interval_days: 7
    expected_content_type: report_or_article
    deep_link_limit: 5
  web2_recon_and_hunting_sources:
    role: watchlist
    domain: web2
    acquisition: single_page
    cadence: on_demand
    trust: contextual
    promotion_policy: proposals_only
    original_source_required: false
    independent_corroboration: required
    refetch_interval_days: 180
    expected_content_type: methodology_or_historical_source
    deep_link_limit: 0
  wordpress_official_security_intelligence:
    role: authority
    domain: platform_specific
    acquisition: feed
    cadence: daily
    trust: primary
    promotion_policy: review_required
    original_source_required: false
    independent_corroboration: conditional
    refetch_interval_days: 1
    expected_content_type: advisory_or_release
    deep_link_limit: 8
